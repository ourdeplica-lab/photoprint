<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F5F6F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="사진 출력">
<title>사진 출력</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#F5F6F8;--panel:#FFFFFF;--line:#E5E8EB;--ink:#191F28;--sub:#6B7684;
--primary:#3182F6;--primary-bg:#E8EFFD;--ok:#15803D;--ok-bg:#E6F4EA;--danger:#DC2626;--danger-bg:#FDECEC;--on:#FFFFFF}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--panel:#1B1F25;--line:#2A3038;--ink:#E8EAED;--sub:#9AA3AD;
--primary:#5B9CF8;--primary-bg:#1D2B44;--ok:#4ADE80;--ok-bg:#16301F;--danger:#F87171;--danger-bg:#3B1A1A;--on:#0B1220}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 Pretendard,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;word-break:keep-all}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 32px}
header{display:flex;align-items:center;justify-content:space-between;height:56px}
h1{font-size:20px;margin:0;font-weight:700}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--sub)}
.conn i{width:8px;height:8px;border-radius:50%;background:currentColor}
.conn.on{color:var(--ok)}.conn.off{color:var(--danger)}
.paper{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 12px;display:flex;justify-content:center;min-height:220px;align-items:center}
.paper canvas{width:100%;height:auto;image-rendering:pixelated;display:block}
.empty{color:#8B95A1;text-align:center;font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on)}
.btn.warn{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;margin-top:12px}
.row>*{flex:1}
.ctl{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-top:16px}
.ctl label{display:flex;align-items:center;gap:12px;height:48px;font-size:15px}
.ctl label span{width:44px;flex:none;color:var(--sub)}
.ctl input[type=range]{flex:1;accent-color:var(--primary)}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;flex:1}
.seg button{flex:1;height:36px;border:0;border-radius:8px;background:transparent;font-size:14px;font-weight:600;color:var(--sub)}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
details.ctl{padding:0 16px}
summary{height:48px;display:flex;align-items:center;font-size:15px;font-weight:700;cursor:pointer}
summary small{margin-left:10px;font-weight:400;font-size:13px;color:var(--sub)}
.step{font-size:15px;font-weight:700;margin:22px 0 8px}
.styles{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.card{flex:0 0 100px;border:2px solid var(--line);border-radius:12px;background:#fff;padding:6px;display:flex;flex-direction:column;gap:6px;scroll-snap-align:start}
.card canvas{width:100%;height:118px;object-fit:cover;object-position:top;border-radius:6px;display:block}
.card span{font-size:13px;font-weight:600;color:#191F28;text-align:center}
.card[aria-pressed=true]{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-bg)}
.link{border:0;background:none;color:var(--primary);font-size:14px;font-weight:600;height:44px;padding:0}
.meta{font-size:13px;color:var(--sub);margin-top:8px;text-align:center}
.status{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--primary-bg);font-size:14px}
.status.ok{background:var(--ok-bg)}.status.bad{background:var(--danger-bg)}
.pin{margin-top:20vh;text-align:center}
.pin input{width:100%;height:54px;border-radius:12px;border:1px solid var(--line);background:var(--panel);text-align:center;font-size:22px;letter-spacing:.3em;margin:16px 0 12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>사진 출력</h1><span id="conn" class="conn"><i></i><b>확인 중</b></span></header>

  <section id="pinBox" class="pin" hidden>
    <div>비밀번호를 넣어 주세요</div>
    <input id="pinIn" type="password" inputmode="numeric" autocomplete="off">
    <button id="pinOk" class="btn primary" type="button">확인</button>
  </section>

  <main id="main" hidden>
    <div id="demo" class="status bad" hidden><b>연습 화면입니다 — 실제로 출력되지 않습니다.</b><br>서버 열쇠가 없습니다. 링크 끝에 <b>#AKfycb…</b>(구글 배포 ID)를 붙여 한 번 열어 주세요.</div>
    <div class="paper"><canvas id="view" hidden></canvas><div id="empty" class="empty">사진을 고르면<br>인쇄될 모습 그대로 보여 드립니다</div></div>
    <div id="meta" class="meta" hidden></div>
    <h2 class="step">1. 사진</h2>
    <button id="pick" class="btn" type="button">사진 찍기 · 고르기</button>
    <input id="file" type="file" accept="image/*" hidden>

    <div id="ctl" hidden>
      <h2 class="step">2. 느낌 고르기</h2>
      <div id="styles" class="styles"></div>
      <details class="ctl"><summary>3. 더 다듬기<small>밝기 · 대비 · 선명 · 종이</small></summary>
        <label><span>밝기</span><input id="bright" type="range" min="-50" max="50" value="0"></label>
        <label><span>대비</span><input id="contrast" type="range" min="-50" max="50" value="0"></label>
        <label><span>선명</span><input id="sharp" type="range" min="-50" max="50" value="0"></label>
        <label><span>종이</span><div class="seg" id="width">
          <button type="button" data-v="512" aria-pressed="true">TM-T83II (512점)</button><button type="button" data-v="576" aria-pressed="false">넓은 프린터 (576점)</button></div></label>
        <button id="reset" class="link" type="button">처음대로</button>
      </details>
    </div>

    <div id="status" class="status" hidden></div>
    <div class="row" style="margin-top:20px"><button id="go" class="btn primary" type="button" disabled>출력</button></div>
  </main>
</div>
<script>
(function(){
  function $(id){return document.getElementById(id)}
  function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}

  /* ---- 서버 연결: 열쇠(구글 배포 ID)는 링크 뒤 #AKfycb… 로 받아 이 휴대폰에 기억한다 ---- */
  var hm=(location.hash||'').match(/AKfycb[\w-]{20,}/), apiId=hm?hm[0]:(lsGet('pp_api')||'');
  if(hm){lsSet('pp_api',apiId);history.replaceState(null,'',location.pathname+location.search)}
  if(/[?&]demo\b/.test(location.search))apiId='';

  /* 데모: 열쇠 없이 열면 가짜 도우미로 동작(출력은 안 됨) */
  var Local=(function(){var job=null;
    function st(){return {ver:'demo',online:true,job:job}}
    return {apiState:function(){return st()},
      apiSend:function(p,wb,h,b){if(b.length!==Math.ceil(wb*h/3)*4)throw new Error('사진 자료가 깨졌습니다.');var j=job={id:String(Date.now()),st:'wait',msg:''};
        setTimeout(function(){if(j.st==='wait')j.st='sent'},2000);setTimeout(function(){if(j.st==='sent'){j.st='done';j.msg='(연습 화면이라 실제로는 출력되지 않았습니다)'}},5000);return st()},
      apiCancel:function(){if(job&&job.st==='wait'){job.st='cancel';job.msg='취소했습니다.'}return st()}};
  })();
  function call(fn){
    var args=[].slice.call(arguments,1);
    if(!apiId)return new Promise(function(res,rej){try{res(JSON.parse(JSON.stringify(Local[fn].apply(null,args))))}catch(e){rej(e)}});
    var base='https://script.google.com/macros/s/'+apiId+'/exec', q='api='+fn+'&p='+encodeURIComponent(JSON.stringify(args))+'&_='+Date.now();
    /* 사진은 길어서 POST(text/plain → 사전 확인 요청 없음), 나머지는 GET */
    var req=base.length+q.length<6000?fetch(base+'?'+q):fetch(base,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({api:fn,args:args})});
    return req.then(function(r){if(!r.ok)throw new Error('서버가 응답하지 않습니다('+r.status+').');return r.text()},
      function(){throw new Error('서버에 연결하지 못했습니다. 인터넷을 확인해 주세요.')})
    .then(function(t){var j;try{j=JSON.parse(t)}catch(e){throw new Error('서버 응답이 이상합니다. Code.gs 배포를 확인해 주세요.')}
      if(!j||!j.ok)throw new Error((j&&j.error)||'서버 오류');return j.data});
  }

  /* ---- 사진 → 프린터 점 그림 ----
     감열 프린터는 검정 한 색이라 회색을 점의 밀도로 바꾼다(디더링). 결과 1비트 = 실제로 찍히는 점 그대로.
     느낌(PRESETS)마다 다듬기 순서: 자동 맞춤 → 잡티 줄이기 → 밝기 곡선(감열지는 점이 번져 진하게 나와 미리 밝힘) → 선명 → 점 찍기 */
  var PRESETS=[
    {id:'natural',name:'자연스럽게',lv:0.5,dn:2,cl:0.35,gm:0.75,wp:235,sh:0.5,dt:'stucki',ed:0.9},
    {id:'bright',name:'밝고 깨끗하게',lv:1,dn:2,cl:0.3,gm:0.62,wp:225,br:4,sh:0.7,dt:'atkinson'},
    {id:'dots',name:'신문 망점',lv:0.5,dn:1,cl:0.3,gm:0.8,wp:240,sh:0.2,dt:'halftone'},
    {id:'sketch',name:'연필 스케치',sk:2.2,shd:0.35,dt:'atkinson'},
    {id:'bold',name:'흑백 강하게',lv:1,dn:2,cl:0.5,gm:0.9,ct:30,dt:'threshold'}];
  var img=null, bits=null, W=512, H=0, MAXH=2400, preset=PRESETS[0];

  function gray(img,W,maxH){
    var iw=img.naturalWidth,ih=img.naturalHeight,dw=W,dh=Math.round(ih*W/iw);
    if(dh>maxH){dw=Math.round(W*maxH/dh);dh=maxH}
    /* 큰 사진을 한 번에 줄이면 계단·모아레가 생겨 반씩 여러 번 줄인다 */
    var src=img,sw=iw,sh=ih;
    while(sw/2>=dw*1.5){var t=document.createElement('canvas');t.width=Math.round(sw/2);t.height=Math.round(sh/2);
      var tx=t.getContext('2d');tx.imageSmoothingQuality='high';tx.drawImage(src,0,0,t.width,t.height);src=t;sw=t.width;sh=t.height}
    var cv=document.createElement('canvas');cv.width=W;cv.height=dh;
    var x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,dh);x.imageSmoothingQuality='high';x.drawImage(src,(W-dw)>>1,0,dw,dh);
    var d=x.getImageData(0,0,W,dh).data,n=W*dh,g=new Float32Array(n);
    for(var i=0;i<n;i++)g[i]=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2];
    return {g:g,W:W,H:dh};
  }
  function clamp(v){return v<0?0:v>255?255:v}
  function boxBlur(src,W,H,r,passes){
    var a=Float32Array.from(src),t=new Float32Array(a.length),k=2*r+1,x,y,s,o;
    for(var p=0;p<passes;p++){
      for(y=0;y<H;y++){o=y*W;s=0;for(x=-r;x<=r;x++)s+=a[o+Math.min(W-1,Math.max(0,x))];
        for(x=0;x<W;x++){t[o+x]=s/k;s+=a[o+Math.min(W-1,x+r+1)]-a[o+Math.max(0,x-r)]}}
      for(x=0;x<W;x++){s=0;for(y=-r;y<=r;y++)s+=t[Math.min(H-1,Math.max(0,y))*W+x];
        for(y=0;y<H;y++){a[y*W+x]=s/k;s+=t[Math.min(H-1,y+r+1)*W+x]-t[Math.max(0,y-r)*W+x]}}
    }
    return a;
  }
  function autoLevel(g,pct){
    var n=g.length,h=new Uint32Array(256),i,lo=0,hi=255,acc=0;
    for(i=0;i<n;i++)h[clamp(g[i])|0]++;
    for(i=0;i<256;i++){acc+=h[i];if(acc>n*pct/100){lo=i;break}}
    acc=0;for(i=255;i>=0;i--){acc+=h[i];if(acc>n*pct/100){hi=i;break}}
    if(hi-lo<16)return;
    for(i=0;i<n;i++)g[i]=(g[i]-lo)*255/(hi-lo);
  }
  function process(src,W,H,p,adj){
    var g=Float32Array.from(src),n=W*H,i,s=W/512;
    if(p.sk){/* 연필: 흐리게 뒤집은 그림으로 밝게 닷지 → 윤곽만 남음 */
      autoLevel(g,1);
      var inv=new Float32Array(n);for(i=0;i<n;i++)inv[i]=255-g[i];
      var b=boxBlur(inv,W,H,Math.max(2,Math.round(7*s)),3);
      var sd=boxBlur(g,W,H,Math.max(2,Math.round(6*s)),2);
      for(i=0;i<n;i++){var dd=255-b[i],d=dd<=0?255:clamp(g[i]*255/dd);/* 음수면 pow 가 NaN → 오차 확산으로 아래가 통째로 하얘짐 */
        /* 선은 진하게(p.sk 제곱), 큰 덩어리 명암을 옅게 깔아 얼굴이 떠 보이지 않게 */
        g[i]=255*Math.pow(d/255,p.sk)*(1-p.shd*Math.max(0,(150-sd[i])/150))}
    }else{
      if(p.lv)autoLevel(g,p.lv);
      if(p.dn)g=boxBlur(g,W,H,1,p.dn);
      if(p.cl){var big=boxBlur(g,W,H,Math.max(3,Math.round(14*s)),2);for(i=0;i<n;i++)g[i]+=p.cl*(g[i]-big[i])}
      if(p.gm)for(i=0;i<n;i++)g[i]=255*Math.pow(clamp(g[i])/255,p.gm);
      /* 감열지는 화면보다 진하게 나옴: 밝은 쪽 끝(wp 이상)은 종이 흰색으로 */
      if(p.wp)for(i=0;i<n;i++)g[i]=g[i]*255/p.wp;
    }
    var br=(p.br||0)+adj.br,ct=(p.ct||0)+adj.ct,c=(100+ct)/100;
    if(br||ct)for(i=0;i<n;i++)g[i]=(g[i]-128)*c+128+br;
    var sh=(p.sh||0)*(1+adj.sh/50);
    if(sh>0){var bl=boxBlur(g,W,H,1,1);for(i=0;i<n;i++)g[i]+=sh*(g[i]-bl[i])}
    return dither(g,W,H,p.dt,p.ed||1);
  }
  var KERNEL={
    fs:[[1,0,7],[-1,1,3],[0,1,5],[1,1,1]],fsd:16,
    atkinson:[[1,0,1],[2,0,1],[-1,1,1],[0,1,1],[1,1,1],[0,2,1]],atkinsond:8,
    stucki:[[1,0,8],[2,0,4],[-2,1,2],[-1,1,4],[0,1,8],[1,1,4],[2,1,2],[-2,2,1],[-1,2,2],[0,2,4],[1,2,2],[2,2,1]],stuckid:42};
  var CELL=6,HT=(function(){/* 망점: 칸 가운데부터 검게 → 둥근 점이 커지는 신문 사진 */
    var a=[],i;for(i=0;i<CELL*CELL;i++){var u=i%CELL+0.5-CELL/2,v=(i/CELL|0)+0.5-CELL/2;a.push({i:i,d:u*u+v*v})}
    a.sort(function(p,q){return p.d-q.d});var t=new Float32Array(CELL*CELL);
    a.forEach(function(o,r){t[o.i]=255*(1-(r+0.5)/(CELL*CELL))});return t})();
  function dither(g,W,H,mode,ed){/* ed<1: 오차를 덜 퍼뜨려 흰 바탕의 잡티·검은 곳의 흰 점을 줄임 */
    var wb=W>>3,bits=new Uint8Array(wb*H),K=KERNEL[mode],D=KERNEL[mode+'d'];
    for(var y=0;y<H;y++){var rtl=K&&(y&1);
      for(var xi=0;xi<W;xi++){var x=rtl?W-1-xi:xi,i=y*W+x,v=g[i],black;
        if(mode==='threshold')black=v<128;
        else if(mode==='halftone')black=v<HT[(y%CELL)*CELL+(x%CELL)];
        else{black=v<128;var e=ed*(v-(black?0:255))/D;
          for(var k=0;k<K.length;k++){var dx=rtl?-K[k][0]:K[k][0],xx=x+dx,yy=y+K[k][1];
            if(xx>=0&&xx<W&&yy<H)g[yy*W+xx]+=e*K[k][2]}}
        if(black)bits[y*wb+(x>>3)]|=0x80>>(x&7)}}
    return bits;
  }
  function draw(cv,bits,W,H){
    cv.width=W;cv.height=H;var cx=cv.getContext('2d'),out=cx.createImageData(W,H),o=out.data,wb=W>>3;
    for(var y=0;y<H;y++)for(var x=0;x<W;x++){var k=(y*W+x)*4,c=bits[y*wb+(x>>3)]&(0x80>>(x&7))?0:255;o[k]=o[k+1]=o[k+2]=c;o[k+3]=255}
    cx.putImageData(out,0,0);
  }
  function adj(){return {br:+$('bright').value,ct:+$('contrast').value,sh:+$('sharp').value}}
  var base=null;
  function render(){
    if(!img)return;
    W=+seg('width');if(!base||base.W!==W)base=gray(img,W,MAXH);H=base.H;
    bits=process(base.g,W,H,preset,adj());
    draw($('view'),bits,W,H);$('view').hidden=false;$('empty').hidden=true;
    var dpm=W===512?7.09:8;$('meta').textContent=preset.name+' · 폭 '+Math.round(W/dpm)+'mm × 길이 약 '+Math.round(H/dpm)+'mm';$('meta').hidden=false;
    $('go').disabled=false;
  }
  function thumbs(){/* 느낌 카드: 작게(폭 192점) 미리 만들어 한눈에 비교 */
    var box=$('styles');box.textContent='';var t=gray(img,192,400);
    PRESETS.forEach(function(p){var b=document.createElement('button');b.type='button';b.className='card';b.setAttribute('aria-pressed',String(p===preset));
      var cv=document.createElement('canvas');draw(cv,process(t.g,t.W,t.H,p,{br:0,ct:0,sh:0}),t.W,t.H);
      var s=document.createElement('span');s.textContent=p.name;b.appendChild(cv);b.appendChild(s);
      b.onclick=function(){preset=p;[].forEach.call(box.children,function(x){x.setAttribute('aria-pressed',String(x===b))});render()};
      box.appendChild(b)});
  }
  function b64(u8){var s='',C=0x8000;for(var i=0;i<u8.length;i+=C)s+=String.fromCharCode.apply(null,u8.subarray(i,i+C));return btoa(s)}
  window.__pp={render:render,get:function(){return {W:W,H:H,bits:bits,preset:preset.id}},b64:b64,dither:dither,PRESETS:PRESETS,process:process,gray:gray};

  function seg(id){var b=$(id).querySelector('[aria-pressed=true]');return b.getAttribute('data-v')}
  $('width').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
    [].forEach.call($('width').children,function(x){x.setAttribute('aria-pressed',String(x===b))});render()});
  var rt=null;['bright','contrast','sharp'].forEach(function(id){$(id).addEventListener('input',function(){clearTimeout(rt);rt=setTimeout(render,80)})});
  $('reset').onclick=function(){['bright','contrast','sharp'].forEach(function(id){$(id).value=0});render()};

  /* 안드로이드 14+ 크롬은 image/* 만 있으면 카메라 없는 사진 선택기로 감 → 가짜 형식 하나를 더 적어 폰의 "카메라/파일" 선택 창을 띄움.
     아이폰은 image/* 만으로 "보관함/사진 찍기" 창이 뜨고, 손대면 HEIC→JPEG 변환이 달라질 수 있어 그대로 둠. 사진 아닌 파일은 im.onerror 가 거름 */
  if(/Android/i.test(navigator.userAgent))$('file').setAttribute('accept','image/*,android/force-camera');
  $('pick').onclick=function(){$('file').click()};
  $('file').onchange=function(){var f=this.files&&this.files[0];if(!f)return;
    var u=URL.createObjectURL(f),im=new Image();
    im.onload=function(){img=im;base=null;$('ctl').hidden=false;thumbs();render();URL.revokeObjectURL(u)};
    im.onerror=function(){show('bad','이 사진은 열 수 없습니다. 다른 사진을 골라 주세요.')};
    im.src=u;this.value=''};

  /* ---- 출력: 두 번 눌러야 나간다(계산 중이 아닌지 현장에서 확인) ---- */
  var pin=lsGet('pp_pin')||'', armed=false, armT=null, watching=false, sentId=null, state=null;
  $('go').onclick=function(){
    if(!bits)return;
    if(!armed){armed=true;$('go').textContent='지금 계산 중 아님 — 한 번 더 누르면 출력';$('go').className='btn warn';
      clearTimeout(armT);armT=setTimeout(disarm,5000);return}
    disarm();$('go').disabled=true;show('','보내는 중…');
    call('apiSend',pin,W>>3,H,b64(bits)).then(function(s){sentId=s.job&&s.job.id;watching=true;apply(s)},function(e){show('bad',e.message);$('go').disabled=false});
  };
  function disarm(){armed=false;$('go').textContent='출력';$('go').className='btn primary'}

  function show(kind,msg){var s=$('status');s.className='status'+(kind?' '+kind:'');s.textContent=msg;s.hidden=!msg}
  var LABEL={wait:'포스 도우미가 가져가기를 기다리는 중…',sent:'프린터로 보내는 중…',done:'출력했습니다.',fail:'출력하지 못했습니다.',cancel:'취소했습니다.'};
  function apply(s){
    state=s;var c=$('conn');c.className='conn '+(!apiId?'':s.online?'on':'off');
    c.querySelector('b').textContent=!apiId?'연습 화면':s.online?'포스 연결됨':'포스 꺼짐';/* 열쇠 없이 연 데모는 진짜 포스와 무관 */
    var j=s.job;if(watching&&j&&j.id===sentId){/* 늦게 도착한 앞 사진 상태는 무시 */show(j.st==='done'?'ok':(j.st==='fail'?'bad':''),LABEL[j.st]+(j.msg?' '+j.msg:''));
      if(j.st!=='wait'&&j.st!=='sent'){watching=false;$('go').disabled=!bits}}
  }
  function tick(){
    if(document.hidden||!pin)return;
    call('apiState',pin).then(apply,function(e){if(/비밀번호/.test(e.message)){pin='';lsSet('pp_pin',null);ask()}});
  }
  function ask(){$('main').hidden=true;$('pinBox').hidden=false;$('pinIn').focus()}
  $('pinOk').onclick=function(){var p=$('pinIn').value.trim();if(!p)return;
    call('apiState',p).then(function(s){pin=p;lsSet('pp_pin',p);$('pinBox').hidden=true;$('main').hidden=false;apply(s)},function(e){$('pinIn').value='';alert(e.message)})};
  $('pinIn').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.isComposing)$('pinOk').click()});
  /* 화면이 열려 있는 동안 2초마다 상태 확인 → 서버가 도우미에게 "빨리 물어봐(3초)" 라고 알려 준다 */
  setInterval(tick,2000);
  if(!apiId){pin='demo';$('demo').hidden=false;$('main').hidden=false;tick()}else if(pin){$('main').hidden=false;tick()}else ask();
})();
</script>
</body>
</html>
